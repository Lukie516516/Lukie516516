  <text x="44" y="194" fill="#8a7368" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, Helvetica, Arial, sans-serif" font-size="16">付款链接只用一次，回执可以核对。链上正式接入还在准备。</text>
